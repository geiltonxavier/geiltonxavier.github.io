baseURL = 'https://geiltonxavier.com.br'
languageCode = 'en-us'
title = 'Geilton Xavier'
theme = 'typo'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages.en]
label = 'English'
locale = 'en-US'
weight = 1
title = 'Geilton Xavier'

[languages.en.params]
description = 'Geilton Xavier writes about software engineering, distributed systems, artificial intelligence, and reliable technology.'
homeCollectionTitle = 'Writing'

[languages.en.menus]
[[languages.en.menus.main]]
identifier = 'posts'
name = 'Posts'
pageRef = '/posts'
weight = 10
[[languages.en.menus.main]]
identifier = 'about'
name = 'About'
pageRef = '/about'
weight = 20
[[languages.en.menus.main]]
identifier = 'cv'
name = 'CV'
pageRef = '/cv'
weight = 30

[languages.pt]
label = 'Português'
locale = 'pt-BR'
weight = 2
title = 'Geilton Xavier'

[languages.pt.params]
description = 'Geilton Xavier escreve sobre engenharia de software, sistemas distribuídos, inteligência artificial e tecnologia confiável.'
homeCollectionTitle = 'Textos'

[languages.pt.menus]
[[languages.pt.menus.main]]
identifier = 'posts'
name = 'Textos'
pageRef = '/posts'
weight = 10
[[languages.pt.menus.main]]
identifier = 'about'
name = 'Sobre'
pageRef = '/about'
weight = 20
[[languages.pt.menus.main]]
identifier = 'cv'
name = 'CV'
pageRef = '/cv'
weight = 30

[taxonomies]
tag = 'tags'

[params]
# Home meta description
description = "A tech-oriented personal blog curated by Geilton Xavier."

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false

singleDateFormat = '2 Jan 2006'

# Collection to display on home
homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = '02 Jan 2006'
listSummaryLength = 220

# Footer
showFooter = false

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "~"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/geiltonxavier/"

[[params.social]]
name = "github"
url = "https://github.com/geiltonxavier"

# Main menu pages
# [[params.menu]]
# name = "home"
# url = "/"

# [[params.menu]]
# name = "tags"
# url = "/tags"


# Syntax highlight on code blocks
[markup]
[markup.highlight]
style = 'bw'

# Deploy settings

[[deployment.matchers]]
pattern = "^.+\\.(js|css|svg|ttf|woff2)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(png|jpg|gif|webp)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = false

