<section class="global-radio" data-home-radio
	data-play-label="{{ if eq .Language.Lang "pt" }}Reproduzir rádio indie{{ else }}Play indie radio{{ end }}"
	data-pause-label="{{ if eq .Language.Lang "pt" }}Pausar rádio indie{{ else }}Pause indie radio{{ end }}"
	data-unavailable-label="{{ if eq .Language.Lang "pt" }}A rádio está temporariamente indisponível.{{ else }}The radio is temporarily unavailable.{{ end }}"
	aria-label="Indie Radio">
	<button class="radio-toggle" type="button" data-radio-toggle
		aria-label="{{ if eq .Language.Lang "pt" }}Reproduzir rádio indie{{ else }}Play indie radio{{ end }}" aria-pressed="false">
		<span class="radio-toggle-icon" aria-hidden="true"></span>
	</button>
	<div class="global-radio-info">
		<span class="radio-label">INDIE RADIO</span>
		<span class="radio-state" data-radio-state>{{ if eq .Language.Lang "pt" }}Parada{{ else }}Stopped{{ end }}</span>
	</div>
	<audio data-radio-audio preload="none" src="https://ice1.somafm.com/indiepop-128-mp3"></audio>
	<p class="radio-error" data-radio-error role="status" aria-live="polite" hidden></p>
</section>
<script defer src="{{ "js/home-radio.js" | relURL }}"></script>
