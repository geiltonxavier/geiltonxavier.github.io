backend:
  name: github
  repo: geiltonxavier/geiltonxavier.github.io
  branch: main
  base_url: https://geilton.com
  auth_endpoint: auth

publish_mode: editorial_workflow
locale: 'pt'

# As imagens do site ficam em /img (static/img). A config antiga apontava
# para static/images/posts, pasta que o site não usa.
media_folder: "static/img"
public_folder: "/img"

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss[Z]" }
      - { label: "Rascunho", name: "draft", widget: "boolean", default: true }
      - { label: "Descrição (meta)", name: "description", widget: "text", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Categorias", name: "categories", widget: "list", required: false }
      - { label: "Mostrar tempo de leitura", name: "readTime", widget: "boolean", required: false }
      - { label: "Corpo", name: "body", widget: "markdown" }
      - { label: "translationKey", name: "translationKey", widget: "hidden" }
      - { label: "slug", name: "slug", widget: "hidden" }

  - name: "memory-notes"
    label: "Memory Notes"
    folder: "content/memory-notes"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss[Z]", required: false }
      - { label: "Descrição", name: "description", widget: "text", required: false }
      - { label: "Resumo (listagem)", name: "summary", widget: "text", required: false }
      - { label: "Local", name: "location", widget: "string", required: false }
      - { label: "Legenda da data", name: "dateLabel", widget: "string", required: false }
      - { label: "Imagem", name: "image", widget: "image", required: false }
      - { label: "Corpo", name: "body", widget: "markdown" }
      - { label: "translationKey", name: "translationKey", widget: "hidden" }
      - { label: "hideBackToTop", name: "hideBackToTop", widget: "hidden" }

  - name: "pages"
    label: "Páginas"
    files:
      - name: "home-en"
        label: "Início (English)"
        file: "content/_index.en.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (meta)", name: "description", widget: "text", required: false }
          - { label: "Corpo", name: "body", widget: "markdown" }
          - { label: "translationKey", name: "translationKey", widget: "hidden" }
          - { label: "bodyClass", name: "bodyClass", widget: "hidden" }
          - { label: "hideBackToTop", name: "hideBackToTop", widget: "hidden" }
          - { label: "hidePagination", name: "hidePagination", widget: "hidden" }
      - name: "home-pt"
        label: "Início (Português)"
        file: "content/_index.pt.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (meta)", name: "description", widget: "text", required: false }
          - { label: "Corpo", name: "body", widget: "markdown" }
          - { label: "translationKey", name: "translationKey", widget: "hidden" }
          - { label: "bodyClass", name: "bodyClass", widget: "hidden" }
          - { label: "hideBackToTop", name: "hideBackToTop", widget: "hidden" }
          - { label: "hidePagination", name: "hidePagination", widget: "hidden" }
      - name: "about-en"
        label: "Sobre (English)"
        file: "content/about.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (meta)", name: "description", widget: "text", required: false }
          - { label: "Corpo", name: "body", widget: "markdown" }
          - { label: "translationKey", name: "translationKey", widget: "hidden" }
          - { label: "bodyClass", name: "bodyClass", widget: "hidden" }
          - { label: "hideBackToTop", name: "hideBackToTop", widget: "hidden" }
          - { label: "hidePagination", name: "hidePagination", widget: "hidden" }
      - name: "about-pt"
        label: "Sobre (Português)"
        file: "content/about.pt.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (meta)", name: "description", widget: "text", required: false }
          - { label: "Corpo", name: "body", widget: "markdown" }
          - { label: "translationKey", name: "translationKey", widget: "hidden" }
