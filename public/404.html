<script>
  document.addEventListener('DOMContentLoaded', function () {
    const wraps = document.querySelectorAll('.home-name-wrap');

    wraps.forEach(function (wrap) {
      const portrait = wrap.querySelector('.bio-portrait');
      if (!portrait) return;

      const activate = function () {
        portrait.style.opacity = '1';
        portrait.style.visibility = 'visible';
        portrait.style.transform = 'translateY(-50%) translateY(0)';
        wrap.classList.add('is-hovered');
      };
      const deactivate = function () {
        portrait.style.opacity = '0';
        portrait.style.visibility = 'hidden';
        portrait.style.transform = 'translateY(-50%) translateY(8px)';
        wrap.classList.remove('is-hovered');
      };

      wrap.addEventListener('mouseenter', activate);
      wrap.addEventListener('mouseleave', deactivate);
      wrap.addEventListener('focusin', activate);
      wrap.addEventListener('focusout', deactivate);
    });
  });
</script>
